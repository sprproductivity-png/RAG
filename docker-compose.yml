services:
  # 1. Vector Database
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant-hybrid-rag
    restart: always
    ports:
      - "6333:6333" # HTTP REST API & Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__ENABLE_CORS=true
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI Hybrid RAG Backend Engine
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-rag-backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - CROSS_ENCODER_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
      - CONTEXTUAL_RETRIEVAL_PROVIDER=heuristic # or anthropic / openai / ollama
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - bm25_data:/app/data/bm25_indexes
      - ./data:/app/data

  # 3. React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react-rag-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  qdrant_storage:
    name: qdrant_storage
  bm25_data:
    name: bm25_data
